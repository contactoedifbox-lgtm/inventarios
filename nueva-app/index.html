  <script>
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

    let imagenBase64 = ""; 

    function procesarImagen(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function() {
        imagenBase64 = reader.result.split(',')[1]; 
        
        document.getElementById('pantalla1').classList.add('hidden');
        document.getElementById('pantallaCarga').classList.remove('hidden');

        enviarOcrAN8N();
      };
      reader.readAsDataURL(file);
    }

    function enviarOcrAN8N() {
      // ASEGÚRATE DE QUE ESTA URL SEA LA DE TU N8N EN MODO TEST
      const WEBHOOK_OCR_URL = 'https://n8n.srv1233440.hstgr.cloud/webhook-test/af6da9c5-01e4-44f5-9fe6-7854016aa065'; 

      const datos = {
        initData: Telegram.WebApp.initData,
        imagenBase64: imagenBase64
      };

      fetch(WEBHOOK_OCR_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(datos)
      })
      .then(response => {
        if (!response.ok) {
          // SI N8N FALLA, QUE NOS DIGA EL CÓDIGO DE ERROR
          throw new Error("Error " + response.status + " en n8n");
        }
        return response.text(); // Leemos como texto para ver si n8n devolvió basura o JSON
      })
      .then(texto => {
        // MOSTRAMOS EN PANTALLA LO QUE DEVOLVIÓ N8N (Para que veas que sí llega)
        Telegram.WebApp.showAlert("LO QUE LLEGÓ DE N8N: \n\n" + texto);
        
        let res;
        try {
          const parsed = JSON.parse(texto);
          res = Array.isArray(parsed) ? parsed[0] : parsed;
        } catch (e) {
          // SI FALLA EL PARSEO, NOS AVISA
          Telegram.WebApp.showAlert("n8n no devolvió JSON. Revisa el Respond to Webhook.");
          throw new Error("JSON inválido");
        }

        // SI LLEGAMOS AQUÍ, LLENAMOS LOS DATOS
        document.getElementById('tipoDoc').value = res.tipoDoc || 'Boleta';
        document.getElementById('monto').value = res.monto || 0;
        document.getElementById('fecha').value = res.fecha || new Date().toISOString().split('T')[0];

        // LLENAMOS OBRAS
        const selectObra = document.getElementById('obra');
        selectObra.innerHTML = ''; 
        
        if (res.data && Array.isArray(res.data)) {
          res.data.forEach(item => {
            const option = document.createElement('option');
            option.value = item.OBRA; 
            option.text = item.OBRA; 
            selectObra.appendChild(option);
          });
        } else {
          selectObra.innerHTML = '<option value="N/A">No hay obras</option>';
        }

        // CAMBIAMOS DE PANTALLA
        document.getElementById('pantallaCarga').classList.add('hidden');
        document.getElementById('pantalla2').classList.remove('hidden');
      })
      .catch(err => {
        // SI HAY UN ERROR DE RED (PORQUE ESTÁS EN MODO TEST Y NO HICISTE CLIC EN LISTEN)
        Telegram.WebApp.showAlert("ERROR DE CONEXIÓN: " + err.message);
        document.getElementById('pantallaCarga').classList.add('hidden');
        document.getElementById('pantalla1').classList.remove('hidden');
      });
    }
