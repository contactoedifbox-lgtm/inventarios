<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Registro de Gastos</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* Variables de color (se adaptan al tema de Telegram) */
    :root {
      --primary-color: #0ea5e9; /* Celeste moderno */
      --primary-hover: #0284c7;
      --bg-color: var(--tg-theme-bg-color, #f8fafc);
      --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      --text-main: var(--tg-theme-text-color, #1e293b);
      --text-muted: var(--tg-theme-hint-color, #64748b);
      --border-color: #e2e8f0;
      --input-bg: var(--tg-theme-bg-color, #ffffff);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      padding: 20px 15px; 
      background: var(--bg-color); 
      color: var(--text-main); 
      -webkit-font-smoothing: antialiased;
    }

    .hidden { display: none !important; }

    h2 { 
      text-align: center; 
      font-size: 22px; 
      font-weight: 700; 
      margin-bottom: 25px; 
      color: var(--text-main);
      letter-spacing: -0.5px;
    }

    .card { 
      background: var(--card-bg); 
      padding: 20px; 
      border-radius: 16px; 
      margin-bottom: 20px; 
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      border: 1px solid var(--border-color);
    }

    label { 
      display: block; 
      font-weight: 600; 
      margin-top: 15px; 
      margin-bottom: 6px;
      font-size: 13px; 
      color: var(--text-muted); 
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    label:first-child { margin-top: 0; }

    input, select { 
      width: 100%; 
      padding: 14px; 
      border-radius: 10px; 
      border: 1.5px solid var(--border-color); 
      font-size: 16px; 
      background: var(--input-bg); 
      color: var(--text-main); 
      transition: all 0.2s ease;
      appearance: none; /* Quita el estilo por defecto en iOS */
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
    }

    /* Estilo para el botón de subir foto */
    .btn-upload {
      background: var(--card-bg);
      color: var(--primary-color);
      border: 2px dashed var(--primary-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 600;
      font-size: 16px;
    }

    .btn-upload:hover {
      background: rgba(14, 165, 233, 0.05);
    }

    .btn-upload svg {
      width: 48px;
      height: 48px;
      margin-bottom: 15px;
      stroke: var(--primary-color);
    }

    /* Botón principal */
    button.btn-primary { 
      width: 100%; 
      padding: 16px; 
      background: var(--primary-color); 
      color: #ffffff; 
      border: none; 
      border-radius: 12px; 
      font-size: 16px; 
      font-weight: 700; 
      margin-top: 20px; 
      cursor: pointer; 
      transition: background 0.2s;
      box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
    }

    button.btn-primary:hover { background: var(--primary-hover); }
    button.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; box-shadow: none; }

    /* Loader animado */
    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 50vh;
    }

    .loader { 
      border: 4px solid rgba(14, 165, 233, 0.2); 
      border-top: 4px solid var(--primary-color); 
      border-radius: 50%; 
      width: 40px; 
      height: 40px; 
      animation: spin 1s linear infinite; 
      margin-bottom: 20px;
    }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .loader-text {
      color: var(--text-muted);
      font-weight: 500;
      font-size: 15px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- PANTALLA 1: FOTO -->
  <div id="pantalla1">
    <h2>Subir Documento</h2>
    <input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none;" onchange="procesarImagen(event)">
    
    <div class="btn-upload" onclick="document.getElementById('fileInput').click()">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
      Tomar o Seleccionar Foto
    </div>
    <p style="text-align:center; font-size: 13px; color: var(--text-muted); margin-top: 15px;">Asegúrate de que el documento se vea claro y completo.</p>
  </div>

  <!-- PANTALLA DE CARGA -->
  <div id="pantallaCarga" class="hidden loader-container">
    <div class="loader"></div>
    <p class="loader-text">Analizando documento con IA...<br><span style="font-size: 12px; opacity: 0.7;">Esto puede tardar unos segundos</span></p>
  </div>

  <!-- PANTALLA 2: FORMULARIO -->
  <div id="pantalla2" class="hidden">
    <h2>Validar Datos</h2>
    
    <div class="card">
      <label>Tipo de Documento</label>
      <select id="tipoDoc">
        <option value="Boleta">Boleta</option>
        <option value="Factura">Factura</option>
        <option value="Transferencia">Transferencia</option>
      </select>

      <label>Monto Total</label>
      <input type="number" id="monto" step="1" placeholder="Ej: 45000">

      <label>Fecha</label>
      <input type="date" id="fecha">
    </div>

    <div class="card">
      <label>Empresa</label>
      <select id="empresa" onchange="actualizarObras()">
        <option value="Surcos">Surcos (Ingeniería)</option>
        <option value="Trazado Sur">Trazado Sur (Constructora)</option>
        <option value="Petra Sur">Petra Sur</option>
      </select>

      <div id="divObras" class="hidden">
        <label>Obra (Solo Trazado Sur)</label>
        <select id="obra">
          <!-- Se llena dinámicamente -->
        </select>
      </div>

      <label>Tipo de Gasto</label>
      <select id="tipoGasto">
        <option value="Combustible">1. Combustible</option>
        <option value="Peaje">2. Peaje</option>
        <option value="Estacionamiento">3. Estacionamiento</option>
        <option value="Alimentación">4. Alimentación</option>
        <option value="Oficina">5. Oficina</option>
        <option value="Materiales">6. Materiales</option>
        <option value="Herramientas o equipos">7. Herramientas o equipos</option>
        <option value="Gastos SD">8. Gastos SD</option>
      </select>
    </div>

    <button onclick="guardarGasto()" id="btnGuardar" class="btn-primary">Guardar Gasto</button>
  </div>

  <script>
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

    let imagenBase64 = ""; 

    function procesarImagen(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function() {
        imagenBase64 = reader.result.split(',')[1]; 
        
        document.getElementById('pantalla1').classList.add('hidden');
        document.getElementById('pantallaCarga').classList.remove('hidden');

        enviarOcrAN8N();
      };
      reader.readAsDataURL(file);
    }

    function enviarOcrAN8N() {
      // ⚠️ RECUERDA CAMBIAR A LA URL DE PRODUCCIÓN (SIN -test) CUANDO YA ESTÉ EN USO
      const WEBHOOK_OCR_URL = 'https://n8n.srv1233440.hstgr.cloud/webhook/af6da9c5-01e4-44f5-9fe6-7854016aa065'; 

      const datos = {
        initData: Telegram.WebApp.initData,
        imagenBase64: imagenBase64
      };

      fetch(WEBHOOK_OCR_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(datos)
      })
      .then(response => {
        if (!response.ok) throw new Error("Error HTTP: " + response.status);
        return response.json(); 
      })
      .then(res => {
        const resultado = Array.isArray(res) ? res[0] : res;

        document.getElementById('tipoDoc').value = resultado.tipoDoc || 'Boleta';
        document.getElementById('monto').value = resultado.monto || 0;
        document.getElementById('fecha').value = resultado.fecha || new Date().toISOString().split('T')[0];

        const selectObra = document.getElementById('obra');
        selectObra.innerHTML = ''; 
        
        if (resultado.data && Array.isArray(resultado.data)) {
          resultado.data.forEach(item => {
            const option = document.createElement('option');
            option.value = item.OBRA; 
            option.text = item.OBRA; 
            selectObra.appendChild(option);
          });
        } else {
          selectObra.innerHTML = '<option value="N/A">No hay obras cargadas</option>';
        }

        document.getElementById('pantallaCarga').classList.add('hidden');
        document.getElementById('pantalla2').classList.remove('hidden');
      })
      .catch(err => {
        console.error("Detalle del error:", err);
        Telegram.WebApp.showAlert("Error de conexión. Revisa tu internet.");
        document.getElementById('pantallaCarga').classList.add('hidden');
        document.getElementById('pantalla1').classList.remove('hidden');
      });
    }

    function guardarGasto() {
      const btn = document.getElementById('btnGuardar');
      btn.innerText = "Guardando...";
      btn.disabled = true;

      const idUnico = Date.now().toString() + Math.floor(Math.random() * 1000);

      const datos = {
        initData: Telegram.WebApp.initData,
        idUnico: idUnico,
        tipoDoc: document.getElementById('tipoDoc').value,
        monto: document.getElementById('monto').value,
        fecha: document.getElementById('fecha').value,
        empresa: document.getElementById('empresa').value,
        obra: document.getElementById('divObras').classList.contains('hidden') ? "N/A" : document.getElementById('obra').value,
        tipoGasto: document.getElementById('tipoGasto').value,
        imagenBase64: imagenBase64 
      };

      const WEBHOOK_GUARDAR_URL = 'https://n8n.srv1233440.hstgr.cloud/webhook/Ingreso_Gasto';

      fetch(WEBHOOK_GUARDAR_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(datos)
      })
      .then(response => response.text())
      .then(res => {
        Telegram.WebApp.showAlert("✅ Gasto guardado con éxito.");
        Telegram.WebApp.close();
      })
      .catch(err => {
        console.error(err);
        Telegram.WebApp.showAlert("❌ Error al guardar. Verifica tu conexión.");
        btn.innerText = "Guardar Gasto";
        btn.disabled = false;
      });
    }

    function actualizarObras() {
      const empresa = document.getElementById('empresa').value;
      const divObras = document.getElementById('divObras');
      if (empresa === 'Trazado Sur') {
        divObras.classList.remove('hidden');
      } else {
        divObras.classList.add('hidden');
      }
    }
  </script>
</body>
</html>
