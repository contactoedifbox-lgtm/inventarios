<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingreso de Gastos</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 15px;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
    }
    h2 { text-align: center; font-size: 20px; }
    .card {
      background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
    }
    label { display: block; font-weight: bold; margin-top: 10px; font-size: 14px; }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      font-size: 16px;
      background-color: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
    }
    button {
      width: 100%;
      padding: 15px;
      background-color: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 20px;
      cursor: pointer;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

  <h2>Registrar Gasto</h2>

  <div class="card">
    <label>Tipo de Documento (Simulado por OCR)</label>
    <input type="text" id="tipoDoc" value="Boleta" readonly style="background-color: #e0e0e0;">

    <label>Monto</label>
    <input type="number" id="monto" value="15000" step="1">

    <label>Fecha</label>
    <input type="date" id="fecha">
  </div>

  <div class="card">
    <label>Categoría del Gasto (8 Opciones)</label>
    <select id="categoria">
      <option value="Materiales">1. Materiales de Construcción</option>
      <option value="Mano de Obra">2. Mano de Obra</option>
      <option value="Herramientas">3. Herramientas</option>
      <option value="Combustible">4. Combustible</option>
      <option value="Fletes">5. Fletes / Transporte</option>
      <option value="Servicios">6. Servicios Básicos</option>
      <option value="Alimentacion">7. Alimentación</option>
      <option value="Otros">8. Otros Gastos</option>
    </select>

    <label>Obra Asociada</label>
    <select id="obra">
      <option value="Obra Central">Obra Central (Av. Principal)</option>
      <option value="Obra Norte">Obra Norte (Los Pinos)</option>
      <option value="Obra Sur">Obra Sur (Costanera)</option>
    </select>
  </div>

  <button onclick="enviarDatos()">Guardar Gasto</button>

  <script>
    // Inicializar Telegram
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

    // Poner la fecha de hoy por defecto
    document.getElementById('fecha').valueAsDate = new Date();

    function enviarDatos() {
      // 1. Recopilar los datos del formulario
      const tipoDoc = document.getElementById('tipoDoc').value;
      const monto = document.getElementById('monto').value;
      const fecha = document.getElementById('fecha').value;
      const categoria = document.getElementById('categoria').value;
      const obra = document.getElementById('obra').value;
      
      // 2. Recopilar la identidad de Telegram (ESTO ES LO QUE VALIDA N8N)
      const initData = Telegram.WebApp.initData;

      // 3. Armar el paquete de datos
      const paquete = {
        initData: initData,
        datosGasto: {
          tipoDoc: tipoDoc,
          monto: monto,
          fecha: fecha,
          categoria: categoria,
          obra: obra
        }
      };

      // 4. Enviar a N8N (Aquí luego pondrás tu URL real de Webhook de N8N)
      // const WEBHOOK_URL = 'https://tu-n8n.com/webhook/ingreso-gastos';
      
      console.log("Datos listos para enviar a N8N:", paquete);
      
      // Simulamos que se envió correctamente y cerramos
      Telegram.WebApp.showAlert("Gasto preparado. (Falta conectar el webhook de n8n)", function() {
        Telegram.WebApp.close();
      });

      /* Descomenta esto cuando tengas el webhook de N8N listo:
      Telegram.WebApp.MainButton.showProgress(); // Muestra un circulito de carga
      fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(paquete)
      })
      .then(response => response.json())
      .then(data => {
        Telegram.WebApp.MainButton.hideProgress();
        Telegram.WebApp.showAlert("¡Gasto guardado con éxito!");
        Telegram.WebApp.close();
      })
      .catch(error => {
        Telegram.WebApp.MainButton.hideProgress();
        Telegram.WebApp.showAlert("Error al guardar. Intenta de nuevo.");
      });
      */
    }
  </script>
</body>
</html>
