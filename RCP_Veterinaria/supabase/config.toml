# Configuracion de Supabase CLI para LankaPets v2.0
# Uso: supabase link --project-ref <ref-dev> y supabase db push
project_id = "vparxfmoqfaahsdqmjcf"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://<usuario>.github.io/inventarios/RCP_Veterinaria/"
additional_redirect_urls = ["http://localhost:5173"]

[auth.email]
enable_signup = false

[functions.admin-usuarios]
verify_jwt = true

[functions.reserva-publica]
verify_jwt = false
